name: Supabase Keep-Alive

# Supabase free plan pauses projects after ~1 week of inactivity.
# This hits an endpoint that performs a real DB write, keeping the project active.
on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:

jobs:
  ping:
    # Upstream-only: forks should delete this workflow or point it at their own
    # deployment — otherwise their cron would ping the upstream API daily.
    if: github.repository == 'stalinzbb/project-plary'
    runs-on: ubuntu-latest
    steps:
      - name: Ping DB-touching endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -X POST https://project-plary.vercel.app/api/plugin/auth/init)
          echo "HTTP $status"
          [ "$status" = "200" ] || exit 1
